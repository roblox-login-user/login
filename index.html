<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log into Roblox</title>
<style>
    /* --- Page & Layout --- */
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0d0d0d;
        background-image: 
            radial-gradient(at 10% 20%, rgba(50,0,50,0.6) 0px, transparent 50%),
            radial-gradient(at 90% 80%, rgba(0,50,50,0.6) 0px, transparent 50%),
            url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==');
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #ffffff;
    }

    /* --- Login Panel Container --- */
    .login-panel {
        background-color: #27272c;
        width: 100%;
        max-width: 440px;
        padding: 36px 36px 32px 36px;
        border-radius: 0px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        box-sizing: border-box;
    }

    /* --- Title --- */
    h1 {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 28px 0;
        color: #ffffff;
    }

    /* --- Input Fields --- */
    .input-group {
        margin-bottom: 12px;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 0px;
        background-color: #38383f;
        border: 1px solid #4a4a52;
        border-radius: 8px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }

    /* --- The Placeholder Text --- */
    input::placeholder {
        color: #e0e0e0;
        font-size: 15px;
        font-weight: 400;
        opacity: 1;
    }

    input:focus {
        outline: none;
        border-color: #007bff;
    }

    /* --- Primary Button --- */
    .login-btn {
        width: 100%;
        padding: 14px 16px;
        margin-top: 4px;
        margin-bottom: 24px;
        background-color: #27272c;
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: none;
        box-sizing: border-box;
    }

    .login-btn:hover {
        background-color: #27272c;
        border-color: #ffffff;
        color: #ffffff;
    }

    /* --- "Forgot" Link --- */
    .forgot-link-container {
        text-align: center;
        margin-bottom: 28px;
    }

    .forgot-link {
        color: #e0e0e0;
        font-size: 14px;
        font-weight: 400;
        text-decoration: none;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }

    /* --- Divider / Spacing helper if needed --- */
    .divider-space {
        height: 12px;
    }

    /* --- Secondary Buttons --- */
    .secondary-btn {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 12px;
        background-color: #38383f;
        border: none;
        border-radius: 8px;
        color: #e0e0e0;
        font-size: 15px;
        font-weight: 400;
        cursor: pointer;
        transition: background-color 0.2s;
        box-sizing: border-box;
    }

    .secondary-btn:hover {
        background-color: #42424a;
    }

    /* --- Bottom Link --- */
    .create-account-container {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #e0e0e0;
        font-weight: 400;
    }

    .create-account-link {
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        margin-left: 4px;
    }

    .create-account-link:hover {
        text-decoration: underline;
    }

</style>
</head>
<body>

    <div class="login-panel">
        <h1>Login to Roblox</h1>

        <div class="input-group">
            <input type="text" placeholder="Username/Email/Phone">
        </div>
        <div class="input-group">
            <input type="password" placeholder="Password">
        </div>

        <button class="login-btn">Log In</button>

        <div class="forgot-link-container">
            <a href="#" class="forgot-link">Forgot Password or Username?</a>
        </div>

        <button class="secondary-btn">Email Me a One-Time Code</button>
        <button class="secondary-btn">Quick Sign-in</button>

        <div class="create-account-container">
            Don't have an account?<a href="#" class="create-account-link">Sign Up</a>
        </div>
    </div>

</body>
</html>
