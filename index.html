<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-image: url('roblox.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .login-container {
    background-color: #090b10;
    padding: 44px 38px 40px 38px;
    border-radius: 16px;
    width: 448px;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.95);
  }

  h2 {
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.4px;
  }

  .input-field {
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 12px;
    background-color: #151821;
    border: 1px solid #202431;
    border-radius: 9px;
    color: #ffffff;
    font-size: 15px;
    box-sizing: border-box;
    outline: none;
  }

  .input-field::placeholder {
    color: #828695;
    opacity: 1;
  }

  .input-field:focus {
    border-color: #3b4154;
  }

  .btn-login {
    width: 100%;
    padding: 15px;
    margin-top: 2px;
    margin-bottom: 25px;
    background-color: #090b10;
    color: #ffffff;
    border: 1px solid #282d3d;
    border-radius: 9px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  .btn-login:hover {
    background-color: #12151e;
  }

  .link-forgot {
    display: block;
    color: #ffffff;
    font-size: 14px;
    text-decoration: none;
    margin-bottom: 28px;
    font-weight: 400;
  }

  .link-forgot:hover {
    text-decoration: underline;
  }

  .divider {
    border: none;
    border-top: 1px solid #1c202d;
    margin-bottom: 28px;
  }

  .btn-secondary {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    background-color: #151821;
    color: #ffffff;
    border: 1px solid #151821;
    border-radius: 9px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  .btn-secondary:hover {
    background-color: #1c202d;
  }

  .link-create {
    display: block;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 30px;
  }

  .link-create:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="login-container">
    <h2>Add account</h2>
    
    <form>
      <input type="text" class="input-field" placeholder="Username/Email/Phone">
      <input type="password" class="input-field" placeholder="Password">
      
      <button type="submit" class="btn-login">Log In</button>
    </form>

    <a href="#" class="link-forgot">Forgot Password or Username?</a>

    <hr class="divider">

    <button class="btn-secondary">Email Me a One-Time Code</button>
    <button class="btn-secondary">Quick Sign-in</button>

    <a href="#" class="link-create">Create A New Account</a>
  </div>

</body>
</html>
