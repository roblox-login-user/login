<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Account</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: url('roblox.jpg') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 40px 24px 24px;
    background: rgba(20, 20, 28, 0.9);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  h1 {
    color: #ffffff;
    font-size: 44px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 40px;
  }
  input {
    width: 100%;
    padding: 18px 16px;
    margin-bottom: 20px;
    background: #23232e;
    border: 1px solid #3a3a46;
    border-radius: 10px;
    color: #d7d7dc;
    font-size: 17px;
    outline: none;
  }
  input::placeholder {
    color: #9a9aa3;
  }
  .login-btn {
    width: 100%;
    padding: 18px 16px;
    margin-bottom: 24px;
    background: transparent;
    border: 1px solid #cfcfd6;
    border-radius: 10px;
    color: #cfcfd6;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .forgot {
    display: block;
    text-align: center;
    color: #f2f2f4;
    font-size: 18px;
    text-decoration: none;
    margin-bottom: 28px;
  }
  hr {
    border: none;
    border-top: 1px solid #3a3a46;
    margin: 0 0 20px;
  }
  .secondary-btn {
    width: 100%;
    padding: 18px 16px;
    margin-bottom: 16px;
    background: #23232b;
    border: none;
    border-radius: 10px;
    color: #d7d7dc;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .create-account {
    display: block;
    text-align: center;
    color: #ffffff;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Add account</h1>

    <input type="text" placeholder="Username/Email/Phone">
    <input type="password" placeholder="Password">

    <button class="login-btn">Log In</button>

    <a href="#" class="forgot">Forgot Password or Username?</a>

    <hr>

    <button class="secondary-btn">Email Me a One-Time Code</button>
    <button class="secondary-btn">Quick Sign-in</button>

    <a href="#" class="create-account">Create A New Account</a>
  </div>
</body>
</html>
