<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .login-container {
    background-color: #0b0d14;
    padding: 40px 36px;
    border-radius: 12px;
    width: 440px;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
  }

  h2 {
    margin-top: 0;
    margin-bottom: 32px;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  .input-field {
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 14px;
    background-color: #171922;
    border: 1px solid #232631;
    border-radius: 8px;
    color: #ffffff;
    font-size: 16px;
    box-sizing: border-box;
  }

  .input-field:focus {
    outline: none;
    border-color: #4a4e5d;
  }

  ::placeholder {
    color: #8c8f9c;
    opacity: 1;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    margin-top: 2px;
    margin-bottom: 24px;
    background-color: transparent;
    color: #ffffff;
    border: 1px solid #363944;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
  }

  .btn-primary:hover {
    background-color: rgba(255, 255, 255, 0.05);
  }

  .link-text {
    display: block;
    color: #ffffff;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 28px;
    font-weight: 400;
  }

  .link-text:hover {
    text-decoration: underline;
  }

  .divider {
    border: none;
    border-top: 1px solid #232631;
    margin-bottom: 28px;
  }

  .btn-secondary {
    width: 100%;
    padding: 16px;
    margin-bottom: 14px;
    background-color: #171922;
    color: #ffffff;
    border: 1px solid transparent;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
  }

  .btn-secondary:hover {
    background-color: #20232e;
  }

  .create-account {
    display: block;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 28px;
  }

  .create-account:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="login-container">
    <h2>Add account</h2>
    
    <form>
      <input type="text" class="input-field" placeholder="Username/Email/Phone">
      <input type="password" class="input-field" placeholder="Password">
      
      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <a href="#" class="link-text">Forgot Password or Username?</a>

    <hr class="divider">

    <button class="btn-secondary">Email Me a One-Time Code</button>
    <button class="btn-secondary">Quick Sign-in</button>

    <a href="#" class="create-account">Create A New Account</a>
  </div>

</body>
</html>
